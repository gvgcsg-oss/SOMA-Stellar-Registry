<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOMA Stellar Registry</title>

<style>
body {
  margin: 0;
  font-family: "Times New Roman", serif;
  background: linear-gradient(to bottom, #050505, #111);
  color: #d4af37;
  text-align: center;
}

.container {
  padding: 40px;
}

h1 {
  font-size: 44px;
  letter-spacing: 4px;
}

h2 {
  font-size: 22px;
  margin-top: 20px;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid #d4af37;
  border-radius: 15px;
  padding: 25px;
  margin: 30px auto;
  width: 65%;
}

img {
  width: 90%;
  border-radius: 10px;
  margin-top: 15px;
}

.tall {
  max-width: 300px;
  height: auto;
}

.footer {
  margin-top: 50px;
  font-size: 13px;
  color: #888;
}
</style>
</head>

<body>

<div class="container">

<h1>SOMA STELLAR REGISTRY</h1>
<h2>Official Stellar Naming Record</h2>

<!-- الشهادة فقط -->
<div class="card">
  <h2>Official Certificate</h2>
  <img src="certificate.png">
</div>

<!-- خريطة النجوم -->
<div class="card">
  <h2>Star Map</h2>
  <img src="star-map.png">
</div>

<!-- صورة النجمة -->
<div class="card">
  <h2>Star Visualization</h2>
  <img src="star.png">
</div>

<!-- رسالة الإهداء -->
<div class="card">
  <h2>Official Dedication Document</h2>
  <img src="dedication.png" class="tall">
</div>

<div class="footer">
  SOMA Stellar Registry • All Rights Reserved
</div>

</div>

</body>
</html>
